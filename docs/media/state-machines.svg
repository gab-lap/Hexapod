<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect width="920" height="600" fill="#ffffff"/>

  <!-- ===== Robot level ===== -->
  <text x="30" y="40" font-size="18" font-weight="bold" fill="#263238">Robot level</text>
  <text x="30" y="60" font-size="12" fill="#607d8b">Robot::stateMachine, checked every loop()</text>
  <line x1="30" y1="72" x2="890" y2="72" stroke="#cfd8dc"/>

  <circle cx="50" cy="150" r="6" fill="#37474f"/>
  <path d="M56 150 H100" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="100" y="105" width="200" height="90" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="200" y="140" font-size="16" font-weight="bold" text-anchor="middle" fill="#0d47a1">Sleep</text>
  <text x="200" y="162" font-size="12" text-anchor="middle" fill="#37474f">legs ease to home position</text>
  <text x="200" y="179" font-size="12" text-anchor="middle" fill="#37474f">(boot state)</text>

  <rect x="620" y="105" width="200" height="90" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="720" y="140" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b5e20">Walk</text>
  <text x="720" y="162" font-size="12" text-anchor="middle" fill="#37474f">sticks → gait phase</text>
  <text x="720" y="179" font-size="12" text-anchor="middle" fill="#37474f">→ foot targets → IK</text>

  <path d="M300 130 H620" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="460" y="120" font-size="12" text-anchor="middle" fill="#263238">right stick click (J2)</text>

  <path d="M620 170 H300" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="460" y="190" font-size="12" text-anchor="middle" fill="#263238">click again</text>
  <text x="460" y="206" font-size="12" text-anchor="middle" fill="#c62828">or no radio packet for 500 ms</text>

  <!-- ===== Leg level ===== -->
  <text x="30" y="270" font-size="18" font-weight="bold" fill="#263238">Leg level (one machine per leg)</text>
  <text x="30" y="290" font-size="12" fill="#607d8b">Leg::stateMachine, driven by the robot state and the cycle phase t (0 to 1)</text>
  <line x1="30" y1="302" x2="890" y2="302" stroke="#cfd8dc"/>

  <circle cx="30" cy="390" r="6" fill="#37474f"/>
  <path d="M36 390 H60" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="60" y="350" width="160" height="80" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="140" y="385" font-size="16" font-weight="bold" text-anchor="middle" fill="#0d47a1">Sleeping</text>
  <text x="140" y="405" font-size="12" text-anchor="middle" fill="#37474f">ONorOFF = 0</text>

  <rect x="380" y="350" width="160" height="80" rx="12" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="460" y="385" font-size="16" font-weight="bold" text-anchor="middle" fill="#e65100">Pushing</text>
  <text x="460" y="405" font-size="12" text-anchor="middle" fill="#37474f">stance, foot on the ground</text>

  <rect x="700" y="350" width="160" height="80" rx="12" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2"/>
  <text x="780" y="385" font-size="16" font-weight="bold" text-anchor="middle" fill="#4a148c">Lifting</text>
  <text x="780" y="405" font-size="12" text-anchor="middle" fill="#37474f">swing, foot in the air</text>

  <!-- Sleeping -> Pushing / Lifting -->
  <path d="M220 390 H380" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="300" y="370" font-size="12" text-anchor="middle" fill="#263238">robot enters Walk</text>
  <text x="300" y="414" font-size="11" text-anchor="middle" fill="#607d8b">(Pushing or Lifting, by t)</text>

  <!-- Pushing -> Lifting -->
  <path d="M540 375 H700" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="620" y="366" font-size="12" text-anchor="middle" fill="#263238">t ≥ pushFraction</text>

  <!-- Lifting -> Pushing -->
  <path d="M700 408 H540" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="620" y="426" font-size="12" text-anchor="middle" fill="#263238">cycle wraps</text>
  <text x="620" y="441" font-size="11" text-anchor="middle" fill="#607d8b">(t &lt; pushFraction)</text>

  <!-- Back to Sleeping -->
  <path d="M460 430 C460 500 140 500 140 430" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M780 430 C780 545 140 545 140 430" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="460" y="560" font-size="12" text-anchor="middle" fill="#c62828">robot enters Sleep (ONorOFF ≤ 0), from either state</text>

  <text x="30" y="590" font-size="11" fill="#90a4ae">The walk cycle advances in proportion to stick deflection. LegStandingState exists in the code but is never entered.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
